services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fanpass
      POSTGRES_PASSWORD: fanpass
      POSTGRES_DB: fanpass
    ports:
      - "5432:5432"
    volumes:
      - fanpass_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  fanpass_postgres:

