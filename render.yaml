services:
  - type: web
    name: fanpass-api-staging
    runtime: node
    # The guarded Staging cutover requires paid-only Maintenance Mode.
    # Applying this Blueprint changes billing; obtain owner approval first.
    plan: starter
    region: oregon
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 60
    buildCommand: npm ci --include=dev --audit=false && npm audit --omit=dev --audit-level=high && npm run build -w apps/api && npm run prisma:deploy -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: FANPASS_ENV
        value: staging
      - key: FANPASS_DATA_SOURCE
        value: prisma
      - key: FANPASS_ENABLE_PRISMA_CONNECT
        value: "true"
      - key: FANPASS_ENABLE_DEMO_AUTH
        value: "false"
      - key: FANPASS_ENABLE_PAYMENTS
        value: "true"
      - key: FANPASS_REQUIRE_PAYMENT_AUTHORIZATION
        value: "true"
      - key: FANPASS_STRIPE_CAPTURE_TIMEOUT_MS
        value: "10000"
      - key: FANPASS_STRIPE_CAPTURE_TX_TIMEOUT_MS
        value: "20000"
      - key: FANPASS_ASYNC_OWNERSHIP_SETTLEMENT
        value: "true"
      - key: FANPASS_SIDE_EFFECT_WORKER_ENABLED
        # The scheduler stays fail-safe off during the maintenance-gated RC rollout.
        # A single probe is run manually after the database revision fence passes.
        value: "false"
      - key: SIDE_EFFECT_WORKER_LIMIT
        value: "1"
      - key: OWNERSHIP_ADAPTER
        value: privy
      - key: FANPASS_ALLOW_PRIVATE_KEY_TESTNET_WRITES
        value: "false"
      - key: FANPASS_CHAIN_PROOF_SYNC_OUTBOX
        value: "true"
      - key: FANPASS_TICKET_CONTRACT_ADDRESS
        sync: false
      - key: FANPASS_LEGACY_OWNERSHIP_ADAPTER
        sync: false
      - key: FANPASS_LEGACY_TICKET_CONTRACT_ADDRESS
        sync: false
      - key: FANPASS_LEGACY_TICKET_CHAIN_ID
        sync: false
      - key: TESTNET_RPC_URL
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: PRIVY_WALLET_AUTHORIZATION_PRIVATE_KEY
        sync: false
      - key: FANPASS_PRIVY_SPONSOR_WALLET_ID
        sync: false
      - key: FANPASS_PRIVY_SPONSOR_WALLET_ADDRESS
        sync: false
      - key: FANPASS_PRIVY_SPONSOR_CHAIN_CAIP2
        value: eip155:11155111
      - key: FANPASS_PRIVY_TRANSACTION_HASH_TIMEOUT_MS
        value: "45000"
      - key: FANPASS_WALLET_RPC_URL
        sync: false
      - key: FANPASS_WALLET_CHAIN_ID
        value: "11155111"
      - key: FANPASS_USDC_CONTRACT_ADDRESS
        value: "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238"
      - key: FANPASS_TRUST_PROXY_HOPS
        value: "1"
      - key: FANPASS_ORDERBOOK_ADMISSION_SECRET
        generateValue: true
      - key: FANPASS_ORDERBOOK_MAX_IDENTITIES
        value: "4096"
      - key: FANPASS_ORDERBOOK_IDENTITY_TTL_MS
        value: "60000"
      - key: FANPASS_ORDERBOOK_IPV6_PREFIX_BITS
        value: "64"
      - key: FANPASS_ORDERBOOK_SUBSCRIPTIONS_PER_10_SECONDS
        value: "16"
      - key: FANPASS_ORDERBOOK_CONNECTIONS_PER_MINUTE
        value: "60"
      - key: FANPASS_ORDERBOOK_MAX_IN_FLIGHT_SNAPSHOTS_PER_ACTOR
        value: "2"
      - key: FANPASS_ORDERBOOK_GLOBAL_IN_FLIGHT_SNAPSHOTS
        value: "32"
      - key: FANPASS_ORDERBOOK_MAX_CONNECTIONS_PER_ACTOR
        value: "32"
      - key: FANPASS_ORDERBOOK_GLOBAL_CONNECTIONS
        value: "512"
      - key: SESSION_TTL_SECONDS
        value: "28800"
      - key: QR_TTL_SECONDS
        value: "30"
      - key: RATE_LIMIT_GENERAL_PER_MINUTE
        value: "600"
      - key: RATE_LIMIT_AUTH_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_VERIFY_PER_MINUTE
        value: "120"
      - key: RATE_LIMIT_PRIVY_PER_MINUTE
        value: "12"
      - key: RATE_LIMIT_PRIVY_ORIGIN_PER_MINUTE
        value: "300"
      - key: RATE_LIMIT_STAFF_INVITE_PER_MINUTE
        value: "6"
      - key: RATE_LIMIT_STAFF_ASSIGNMENT_PER_MINUTE
        value: "30"
      - key: FANPASS_SIDE_EFFECT_LOCK_TIMEOUT_SECONDS
        value: "300"
      - key: SIDE_EFFECT_HEALTH_PROCESSING_STALE_SECONDS
        value: "300"
      - key: SIDE_EFFECT_HEALTH_PENDING_STALE_SECONDS
        value: "900"
      - key: FANPASS_CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FANPASS_STAGING_DATABASE_IDENTITY_SHA256
        sync: false
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: FANPASS_ONSALE_QUEUE_SECRET
        generateValue: true
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_VERIFICATION_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
  - type: web
    name: fanpass-console-staging
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev --audit=false && npm audit --omit=dev --audit-level=high && npm run build -w apps/dashboard
    startCommand: npm run start -w apps/dashboard
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: FANPASS_ENV
        value: staging
      - key: FANPASS_API_BASE_URL
        value: https://fanpass-api-staging.onrender.com
      - key: VITE_API_BASE_URL
        value: https://fanpass-api-staging.onrender.com
      - key: FANPASS_CONSOLE_ORIGINS
        sync: false
      - key: FANPASS_CONSOLE_AUTH_ORIGIN
        value: https://fanpass-console-auth-staging.onrender.com
      - key: VITE_CONSOLE_AUTH_BASE_URL
        value: https://fanpass-console-auth-staging.onrender.com
  - type: web
    name: fanpass-console-auth-staging
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/console-auth
    autoDeployTrigger: "off"
    buildCommand: npm_config_include=dev npm ci --audit=false && npm audit --omit=dev --audit-level=high && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: FANPASS_ENV
        value: staging
      - key: FANPASS_PRIVY_SESSION_MODE
        value: browser-sdk
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      - key: FANPASS_CONSOLE_SESSION_BRIDGE_URL
        value: https://fanpass-console-staging.onrender.com/api/console/privy-session
      - key: FANPASS_CONSOLE_URL
        value: https://fanpass-console-staging.onrender.com
