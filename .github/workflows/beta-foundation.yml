name: FanPass Beta Foundation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  beta-foundation:
    name: Node 22 foundation gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fanpass
          POSTGRES_PASSWORD: fanpass
          POSTGRES_DB: fanpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fanpass -d fanpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fanpass:fanpass@localhost:5432/fanpass
      FANPASS_DATA_SOURCE: prisma
      FANPASS_SKIP_DOCKER_POSTGRES: "true"
      FANPASS_STRICT_NODE_RUNTIME: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install isolated Console Auth dependencies
        run: npm --prefix apps/console-auth ci --include=dev

      - name: Apply Prisma schema
        run: npm run prisma:push -w apps/api

      - name: Verify on-sale concurrency invariants
        env:
          FANPASS_RUN_DATABASE_TESTS: "true"
        run: npm run test -w apps/api -- --runTestsByPath test/onsales-prisma-concurrency.spec.ts

      - name: Verify Beta foundation
        run: npm run beta:foundation:verify
